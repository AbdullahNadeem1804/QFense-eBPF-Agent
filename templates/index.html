<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QFense Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .table-header { background-color: #1e293b; }
        .table-row:hover { background-color: #334155; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-purple-400">QFense eBPF Agent</h1>
                <p class="text-slate-400 mt-1">Live Cryptographic Discovery & Container Attribution</p>
            </div>
            <div class="flex space-x-4">
                <a href="/export-cbom" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded transition">Export CBOM</a>
                <span class="inline-flex items-center px-3 py-2 rounded text-sm font-medium bg-green-900 text-green-300 border border-green-700">
                    <span class="w-2 h-2 mr-2 bg-green-400 rounded-full animate-pulse"></span> Engine Active
                </span>
            </div>
        </header>
        <div class="bg-slate-800 rounded-lg shadow-xl border border-slate-700 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="table-header text-slate-400 text-sm uppercase tracking-wider">
                    <tr>
                        <th class="py-4 px-6">Time</th>
                        <th class="py-4 px-6">Event Type</th>
                        <th class="py-4 px-6">Algorithm</th>
                        <th class="py-4 px-6">Process / PID</th>
                        <th class="py-4 px-6">Container</th>
                        <th class="py-4 px-6">Risk Level</th>
                    </tr>
                </thead>
                <tbody id="event-log" class="divide-y divide-slate-700 font-mono text-sm"></tbody>
            </table>
        </div>
    </div>
    <script>
        const tbody = document.getElementById('event-log');
        
        function addRowToTable(data) {
            const row = document.createElement('tr');
            row.className = "table-row border-b border-slate-700";

            // Risk logic
            let riskClass = "bg-gray-700 text-gray-300";
            if (data.risk === "HIGH") riskClass = "bg-red-900 text-red-300 border border-red-700";
            if (data.risk === "MEDIUM") riskClass = "bg-orange-900 text-orange-300 border border-orange-700";
            if (data.risk === "PQC_OBSERVED") riskClass = "bg-blue-900 text-blue-300 border border-blue-700";
            if (data.risk === "INFO") riskClass = "bg-gray-700 text-gray-300 border border-gray-600";

            // Action logic
            let badgeClass = "bg-yellow-900 text-yellow-300";
            if (data.event_type === 1) badgeClass = "bg-cyan-900 text-cyan-300";
            if (data.event_type === 2) badgeClass = "bg-green-900 text-green-300";
            if (data.event_type === 3) badgeClass = "bg-red-900 text-red-300";

	    let timeStr = data.observed_at ? new Date(data.observed_at).toLocaleTimeString() : new Date().toLocaleTimeString();
            let algoName = data.algorithm || data.algo || "Unknown";
            let procName = data.process_name || data.proc || "Unknown";
            let containerId = data.container_id || data.container || "Host Process";

            row.innerHTML = `
                <td class="py-3 px-6 text-slate-400">${timeStr}</td>
                <td class="py-3 px-6"><span class="px-2 py-1 rounded text-xs font-bold ${badgeClass}">${data.action}</span></td>
                <td class="py-3 px-6 text-purple-300 font-bold">${algoName}</td>
                <td class="py-3 px-6">${procName} <span class="text-slate-500">(${data.pid})</span></td>
                <td class="py-3 px-6 text-slate-400">${containerId}</td>
                <td class="py-3 px-6"><span class="px-2 py-1 rounded text-xs font-bold ${riskClass}">${data.risk}</span></td>
            `;

            tbody.insertBefore(row, tbody.firstChild);
            if (tbody.children.length > 50) tbody.removeChild(tbody.lastChild);
        }

        // Fetch initial data
        fetch('/api/v1/events').then(res => res.json()).then(events => {
            events.reverse().forEach(addRowToTable);
        });

        // SSE Stream
        const source = new EventSource('/stream');
        source.onmessage = function(e) {
            const data = JSON.parse(e.data);
            addRowToTable(data);
        };
    </script>
</body>
</html>
