<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QFense Enterprise Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .table-header { background-color: #1e293b; }
        .table-row:hover { background-color: #334155; }
        .badge-context { background-color: #854d0e; color: #fef08a; }
        .badge-action { background-color: #164e63; color: #a5f3fc; }
        .badge-success { background-color: #14532d; color: #bbf7d0; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <header class="mb-8 flex justify-between items-center border-b border-slate-700 pb-4">
            <div>
                <h1 class="text-3xl font-bold text-purple-400">QFense eBPF Agent</h1>
                <p class="text-slate-400 mt-1">Live Cryptographic Discovery & Container Attribution</p>
            </div>
            <div class="text-right flex items-center gap-4">
                <a href="/export-cbom" class="bg-purple-600 hover:bg-purple-500 text-white font-bold py-2 px-4 rounded transition duration-150 text-sm">
                    Export CBOM
                </a>
                <span class="inline-flex items-center px-3 py-1 rounded-full text-sm font-medium bg-green-900 text-green-300 border border-green-700">
                    <span class="w-2 h-2 mr-2 bg-green-400 rounded-full animate-pulse"></span>
                    Engine Active
                </span>
            </div>
        </header>

        <div class="bg-slate-800 rounded-lg shadow-xl border border-slate-700 overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead class="table-header text-slate-400 text-sm uppercase tracking-wider">
                    <tr>
                        <th class="py-4 px-6">Time</th>
                        <th class="py-4 px-6">Event Type</th>
                        <th class="py-4 px-6">Algorithm</th>
                        <th class="py-4 px-6">Process / PID</th>
                        <th class="py-4 px-6">Container ID</th>
                    </tr>
                </thead>
                <tbody id="event-log" class="divide-y divide-slate-700 font-mono text-sm">
                    <!-- Events will be injected here -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const eventSource = new EventSource("/stream");
        const tbody = document.getElementById("event-log");
        
	// Fetch historical events on page load
        fetch('/api/v1/events')
            .then(response => response.json())
            .then(events => {
                events.reverse().forEach(data => {
                    addRowToTable(data);
                });
            });

        function addRowToTable(data) {
            const row = document.createElement("tr");
            row.className = "table-row transition-colors duration-150";

            let badgeClass = "badge-context";
            if (data.event_type === 1) badgeClass = "badge-action";
            if (data.event_type === 2) badgeClass = "badge-success";

            row.innerHTML = `
                <td class="py-3 px-6 text-slate-400">${new Date(data.observed_at).toLocaleTimeString()}</td>
                <td class="py-3 px-6"><span class="px-2 py-1 rounded text-xs font-bold ${badgeClass}">${data.action}</span></td>
                <td class="py-3 px-6 text-purple-300 font-bold">${data.algorithm}</td>
                <td class="py-3 px-6">${data.process_name} <span class="text-slate-500">(${data.pid})</span></td>
                <td class="py-3 px-6 text-cyan-400">${data.container_id}</td>
            `;
            tbody.insertBefore(row, tbody.firstChild);
        }

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            // Map the live SSE data to match the DB format
            const dbFormat = {
                observed_at: new Date().toISOString(),
                action: data.action,
                algorithm: data.algo,
                process_name: data.proc,
                pid: data.pid,
                container_id: data.container,
                event_type: data.event_type
            };
            addRowToTable(dbFormat);
            
            if (tbody.children.length > 15) {
                tbody.removeChild(tbody.lastChild);
            }
        };
    </script>
</body>
</html>
